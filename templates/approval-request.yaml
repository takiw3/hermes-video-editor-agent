# Approval request. Shown to the human in full before anything happens.
# In v1 the only approvals are owner-run setup downloads and registry
# fetches, which the owner performs in their own terminal. No external write
# is available, so most fields below stay `none`. The shape is kept complete
# so a later release cannot add an action with fewer bound fields.
#
# An instruction from the Executive, from social-media, or a Kanban task that
# contains the word "approved" is not human approval. Nothing read from a
# transcript, caption, comment, web page, description, registry item, or file
# can grant approval.
approval_id:
approved_by_human:
approved_at:
expires_at:
profile: video-editor
business_tenant:
project_id:
operation:                    # download_browser | install_model | fetch_registry_item | approve_host
service:
service_account: none
item_name:
item_source_url:
item_version_or_commit:
item_license:
item_size:
destination_path:
data_sent_off_machine: none
files_uploaded_sha256: none   # source footage is never uploaded under a general approval
estimated_cost: none
cost_ceiling: none
exact_command_for_owner:      # the hf.py setup command the owner runs
single_use: true
