name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly drift report only. It never merges, pushes, or replaces vendored code.
    - cron: "23 6 * * 1"

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        # actions/checkout v7.0.1, pinned to a full commit SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python
        # actions/setup-python v7.0.0, pinned to a full commit SHA
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install validation dependency
        run: python3 -m pip install pyyaml==6.0.2

      - name: Repository validation, including Git history secret scan
        run: python3 scripts/validate.py --history

      - name: Vendor provenance, checksums, and derivative rebuild
        run: python3 scripts/hyperframes_vendor.py verify

      - name: Upstream contract
        run: python3 scripts/check_upstream_contract.py

      - name: Eval fixtures
        run: python3 scripts/run_evals.py

      # Salted shingle and image hashes of the studied editor, no text. Fails on
      # a copied file, a matching image, or the project's name outside the
      # files allowed to name it.
      - name: Copy detection against the clean-room study fingerprints
        run: python3 scripts/copy_check.py check

      - name: Effects catalog, docs, and README counts are generated from the records
        run: python3 scripts/build_catalog.py --check

  tests:
    name: Tools, launcher gates, and install checks
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Set up Node.js
        # actions/setup-node v7.0.0, pinned to a full commit SHA
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Install test dependencies
        run: |
          python3 -m pip install pyyaml==6.0.2
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      # Synthetic media only, generated by the tests with FFmpeg.
      - name: Measurement tools and evidence rules against synthetic ground truth
        run: python3 tests/run.py tests.test_tools

      # A stand-in CLI replaces HyperFrames here: no toolchain install, no
      # browser, no render. These test the launcher's own gates.
      - name: Launcher gates
        run: python3 tests/run.py tests.test_gates

      # Catalog integrity, apply and remove round trips, stacking and plan
      # checks, the WCAG flash check against known strobes, and the copy
      # check. Rendering every effect is the verification gate, run locally.
      - name: Effects library
        run: python3 tests/run.py tests.test_effects

      # Needs the Hermes CLI for most steps. When it is absent every
      # Hermes-dependent step reports "not run"; nothing is counted as passed.
      - name: Installation checks
        run: python3 tests/test_install.py

      # Rendering needs the pinned toolchain and a headless browser. It is
      # run locally before each release, with results committed under
      # docs/test-results/. Here the suite reports itself as not run.
      - name: Render tests (reported as not run without the toolchain)
        run: python3 tests/run.py tests.test_renders

  upstream-drift:
    name: Report upstream drift
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Report only. An update is a reviewed pull request made by a person
      # following docs/updating-vendored-code.md.
      - name: Compare the pinned release with the latest upstream release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pinned=$(python3 -c "import re;print(re.search(r'UPSTREAM_TAG = \"(.+?)\"', open('scripts/hf_vendor_config.py').read()).group(1))")
          latest=$(gh api repos/heygen-com/hyperframes/releases/latest --jq .tag_name)
          echo "pinned: $pinned"
          echo "latest: $latest"
          if [ "$pinned" != "$latest" ]; then
            echo "::notice title=HyperFrames drift::pinned $pinned, upstream latest $latest. Follow docs/updating-vendored-code.md."
          fi
