      <filter id="fx-{{iid}}-filter" color-interpolation-filters="sRGB" x="0" y="0" width="100%" height="100%">
        <feColorMatrix type="matrix" values="0.2126 0.7152 0.0722 0 0  0.2126 0.7152 0.0722 0 0  0.2126 0.7152 0.0722 0 0  0 0 0 1 0" />
        <feComponentTransfer class="fx-{{iid}}-knee">
          <feFuncR type="linear" slope="3" intercept="-2" />
          <feFuncG type="linear" slope="3" intercept="-2" />
          <feFuncB type="linear" slope="3" intercept="-2" />
        </feComponentTransfer>
        <feColorMatrix class="fx-{{iid}}-tint" type="matrix" values="1 0 0 0 0  0 0.4 0 0 0  0 0 0.15 0 0  0 0 0 1 0" />
        <feGaussianBlur class="fx-{{iid}}-blur" stdDeviation="3" result="glow" />
        <feComposite class="fx-{{iid}}-add" in="glow" in2="SourceGraphic" operator="arithmetic" k1="0" k2="0.6" k3="1" k4="0" result="fx" />
        <feComposite in="fx" in2="SourceGraphic" operator="arithmetic" k1="0" k2="1" k3="0" k4="0" class="fx-{{iid}}-mix" />
      </filter>
