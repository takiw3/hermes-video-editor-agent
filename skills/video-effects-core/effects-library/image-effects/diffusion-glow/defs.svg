      <filter id="fx-{{iid}}-filter" color-interpolation-filters="sRGB" x="0" y="0" width="100%" height="100%">
        <feGaussianBlur class="fx-{{iid}}-blur" stdDeviation="3" result="soft" />
        <feBlend in="soft" in2="SourceGraphic" mode="screen" result="screened" />
        <feComposite class="fx-{{iid}}-haze" in="screened" in2="SourceGraphic" operator="arithmetic" k1="0" k2="0.35" k3="0.65" k4="0" result="fx" />
        <feComposite in="fx" in2="SourceGraphic" operator="arithmetic" k1="0" k2="1" k3="0" k4="0" class="fx-{{iid}}-mix" />
      </filter>
